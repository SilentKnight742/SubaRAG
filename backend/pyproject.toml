[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "subarag-backend"
version = "0.1.0"
description = "Provider-neutral services for SubaRAG"
requires-python = ">=3.11"

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]
