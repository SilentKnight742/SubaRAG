services:
  - type: web
    name: subarag
    runtime: docker
    plan: free
    region: singapore
    branch: feature/pinned-corpus-hosting
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "7860"
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: SUBARAG_DATA_REPO
        value: silentkirmada/SubaRAG-data
      - key: SUBARAG_DATA_REVISION
        value: e29f5c990a4fc0d8e05771be4007f1c6560adfc2
      - key: SUBARAG_TRANSCRIPTION_PROVIDER
        value: elevenlabs
      - key: SUBARAG_ALLOW_PROVIDER_SELECTION
        value: "false"
      - key: SUBARAG_PREVIEW_PASSWORD
        generateValue: true
